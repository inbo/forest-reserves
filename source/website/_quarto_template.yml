project:
  type: website
  preview:
    port: 4201
    browser: true
  render:
  - '*.md'
  - '*.qmd'
  - '!LICENSE.md'
  - '!README.md'
  output-dir: ../../output/website
  pre-render: pre_render.R
  post-render: _extensions/flandersqmd-website/filters/post_render.R
execute:
  echo: false
  warnings: true
  errors: true
  message: true
  freeze: false
  cache: false
format:
  flandersqmd-website-html: default
lang: nl-BE
flandersqmd:
  entity: INBO
  level: 2
  title: Bosreservaten in Vlaanderen
  subtitle:
  shorttitle: bosreservaten
  author:
  - name:
      given: Arno
      family: Thomaes
    email: arno.thomaes@inbo.be
    orcid: 0000-0001-5723-5976
    affiliation:
    - Instituut voor Natuur- en Bosonderzoek (INBO)
    corresponding: true
  reviewer:
  - name:
      given: Els
      family: Lommelen
    email: els.lommelen@inbo.be
    orcid: 0000-0002-3481-5684
    affiliation:
    - Instituut voor Natuur- en Bosonderzoek (INBO)
  public_report: false
  colophon: true
  floatbarrier: section
  year: 2026
  url: https://inbo.github.io/bosreservaten/
website:
  page-footer:
    left: '{{< authors >}}'
    center: '{{< inbo_info >}}'
    right: '{{< reference >}}'
  navbar:
    tools:
    - icon: mastodon
      href: https://mastodon.online/@inbo
    - icon: bluesky
      href: https://bsky.app/profile/inbo.be
    - icon: facebook
      href: https://www.facebook.com/INBOVlaanderen/
    - icon: github
      menu:
      - text: Source Code
        url:  https://github.com/inbo/flandersqmd-website
      - text: Report a Bug
        url:  https://github.com/inbo/flandersqmd-website/issues
    left:
    - text: Wat?
      file: wat.md
    - text: Reservaten
      file: reservaten.qmd
  sidebar:
    style: "docked"
    contents:
      - wat.md
      - nietsdoen.md
      - juridisch.md
      - reservaten.qmd
      - onderzoek.md
      - internationaal.md
      - section: "Bosreservaten in cijfers"
        href: cijfers.md
        contents:
          - <<<ADD RESERVES>>>
      - meer.md
      - referenties.md
bibliography: references.bib
